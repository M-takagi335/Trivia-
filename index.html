<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trivia Timeline</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --bg-2: #ffffff;
      --card: rgba(255, 255, 255, .94);
      --card-strong: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: rgba(17, 24, 39, .09);
      --accent: #6d5dfc;
      --accent-2: #0ea5e9;
      --accent-soft: rgba(109, 93, 252, .10);
      --danger: #e11d48;
      --shadow: 0 20px 60px rgba(17, 24, 39, .10);
      --page-bg:
        radial-gradient(circle at 15% 0%, rgba(109,93,252,.08), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(14,165,233,.06), transparent 24%),
        linear-gradient(180deg, #fbfcfe 0%, #f4f6fa 100%);
      --app-bg: rgba(255,255,255,.78);
      --topbar-bg: rgba(255,255,255,.84);
      --card-bg: linear-gradient(180deg, rgba(255,255,255,.98), rgba(250,251,253,.96));
      --card-hover-bg: linear-gradient(180deg, #ffffff, #f8faff);
      --summary: #374151;
      --tab-text: #5f6877;
      --soft-bg: rgba(17,24,39,.045);
      --modal-overlay: rgba(17,24,39,.42);
      --modal-bg: linear-gradient(180deg, rgba(255,255,255,.99), rgba(248,250,252,.99));
      --detail-text: #344054;
      --detail-summary: #1f2937;
      --accent-label: #6556de;
      --title-gradient: linear-gradient(90deg, #111827, #5b4fe0 55%, #0284c7);
      --modal-title-gradient: linear-gradient(90deg, #111827, #5b4fe0);
      --wiki-badge-bg: rgba(17,24,39,.055);
      --wiki-badge-text: #111827;
      --menu-shadow: 0 18px 60px rgba(17,24,39,.16);
    }

    html[data-theme="dark"] {
      --bg: #0b1020;
      --bg-2: #11182b;
      --card: rgba(17, 24, 39, .72);
      --card-strong: rgba(22, 30, 48, .92);
      --text: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, .14);
      --accent: #7c3aed;
      --accent-2: #22d3ee;
      --accent-soft: rgba(124, 58, 237, .14);
      --danger: #fb7185;
      --shadow: 0 24px 70px rgba(0, 0, 0, .28);
      --page-bg:
        radial-gradient(circle at 15% 0%, rgba(124,58,237,.18), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(34,211,238,.12), transparent 24%),
        linear-gradient(180deg, #0b1020 0%, #090d18 100%);
      --app-bg: rgba(7, 12, 24, .56);
      --topbar-bg: rgba(8, 13, 26, .74);
      --card-bg: linear-gradient(180deg, rgba(18,25,43,.76), rgba(13,19,33,.72));
      --card-hover-bg: linear-gradient(180deg, rgba(24,33,55,.9), rgba(15,22,38,.86));
      --summary: #cbd5e1;
      --tab-text: #cbd5e1;
      --soft-bg: rgba(148,163,184,.10);
      --modal-overlay: rgba(2, 6, 23, .72);
      --modal-bg: linear-gradient(180deg, rgba(18,25,43,.98), rgba(8,13,26,.98));
      --detail-text: #dbe4ef;
      --detail-summary: #e2e8f0;
      --accent-label: #c4b5fd;
      --title-gradient: linear-gradient(90deg, #fff, #c4b5fd 45%, #67e8f9);
      --modal-title-gradient: linear-gradient(90deg, #fff, #c4b5fd);
      --wiki-badge-bg: rgba(255,255,255,.08);
      --wiki-badge-text: #fff;
      --menu-shadow: 0 18px 60px rgba(0,0,0,.34);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
        "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }

    button, input { font: inherit; }

    .app {
      width: min(760px, 100%);
      margin: 0 auto;
      min-height: 100vh;
      background: var(--app-bg);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      box-shadow: 0 0 80px rgba(0,0,0,.18);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--topbar-bg);
      backdrop-filter: blur(22px) saturate(140%);
      border-bottom: 1px solid var(--line);
      padding: 14px 18px 12px;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -.03em;
      font-weight: 850;
      background: var(--title-gradient);
      -webkit-background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .tab {
      border: 0;
      border-radius: 999px;
      padding: 8px 13px;
      background: var(--soft-bg);
      color: var(--tab-text);
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
    }

    .tab.active {
      background: linear-gradient(135deg, var(--accent), #5b21b6);
      color: white;
      box-shadow: 0 8px 24px rgba(124,58,237,.28);
    }

    .timeline {
      min-height: 240px;
    }

    .card {
      position: relative;
      padding: 17px 18px 15px;
      border-bottom: 1px solid var(--line);
      background: var(--card-bg);
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
      cursor: pointer;
      margin: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0,0,0,.16);
    }

    .card:hover {
      transform: translateY(-2px);
      background: var(--card-hover-bg);
      border-color: rgba(124,58,237,.35);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .word {
      margin: 0;
      font-size: 19px;
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: -.01em;
      overflow-wrap: anywhere;
    }

    .summary {
      margin: 8px 0 0;
      font-size: 15px;
      line-height: 1.6;
      color: var(--summary);
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .meta {
      margin-top: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .wiki-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .fav-btn {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--soft-bg);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: #64748b;
      font-size: 19px;
      transition: .15s ease;
    }

    .fav-btn:hover {
      background: rgba(251,113,133,.10);
      border-color: #ffd0e4;
      color: var(--danger);
    }

    .fav-btn.active {
      color: var(--danger);
      border-color: #ffd0e4;
      background: rgba(251,113,133,.10);
    }

    .load-more-wrap {
      padding: 18px;
      background: transparent;
    }

    .load-more {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5 52%, #0891b2);
      color: white;
      font-weight: 800;
      box-shadow: 0 14px 35px rgba(79,70,229,.26);
      cursor: pointer;
    }

    .load-more:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .status {
      padding: 34px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .spinner {
      width: 26px;
      height: 26px;
      margin: 0 auto 12px;
      border: 3px solid #dbe7ef;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: var(--modal-overlay);
      backdrop-filter: blur(10px);
    }

    .modal.show { display: flex; }

    .modal-panel {
      width: min(680px, 100%);
      max-height: min(82vh, 820px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--modal-bg);
      border: 1px solid rgba(148,163,184,.18);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,.22);
    }

    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .modal-title {
      margin: 0;
      font-size: 23px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .close-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 999px;
      background: var(--soft-bg);
      cursor: pointer;
      font-size: 20px;
    }

    .modal-body {
      overflow-y: auto;
      padding: 18px 20px 24px;
    }

    .detail-text {
      margin: 0;
      white-space: pre-wrap;
      font-size: 15px;
      line-height: 1.8;
      color: var(--detail-text);
    }


    .detail-block {
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }

    .detail-block:first-child { padding-top: 0; }

    .detail-label {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 5px 9px;
      margin-bottom: 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-label);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .detail-summary {
      margin: 0;
      font-size: 17px;
      line-height: 1.75;
      font-weight: 650;
      color: var(--detail-summary);
    }

    .detail-loading {
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 12px;
      background: var(--soft-bg);
      color: var(--muted);
      font-size: 13px;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .action {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 800;
      text-decoration: none;
      font-size: 13px;
    }

    .action.primary {
      background: var(--accent);
      color: white;
    }

    .action.secondary {
      background: var(--soft-bg);
      color: var(--detail-summary);
    }

    .empty-note {
      padding: 48px 22px;
      text-align: center;
      color: var(--muted);
      line-height: 1.8;
    }


    .topbar::after {
      content: "";
      position: absolute;
      left: 18px; right: 18px; bottom: -1px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(124,58,237,.7), rgba(34,211,238,.55), transparent);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      border-radius: 20px 0 0 20px;
      background: linear-gradient(180deg, #8b5cf6, #22d3ee);
      opacity: .75;
    }

    .wiki-label::before {
      content: "W";
      width: 20px; height: 20px;
      border-radius: 7px;
      display: inline-grid;
      place-items: center;
      font-family: Georgia, serif;
      font-weight: 700;
      color: var(--wiki-badge-text);
      background: var(--wiki-badge-bg);
      border: 1px solid var(--line);
    }

    .load-more {
      transition: transform .18s ease, filter .18s ease;
    }

    .load-more:hover { transform: translateY(-1px); filter: brightness(1.06); }

    .modal-title {
      background: var(--modal-title-gradient);
      -webkit-background-clip: text;
      color: transparent;
    }

    .menu-wrap {
      position: relative;
      flex: 0 0 auto;
    }

    .menu-button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--soft-bg);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform .16s ease, background .16s ease;
    }

    .menu-button:hover { transform: translateY(-1px); }

    .hamburger {
      width: 18px;
      display: grid;
      gap: 4px;
    }

    .hamburger span {
      display: block;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
    }

    .menu-panel {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 230px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card-strong);
      box-shadow: var(--menu-shadow);
      opacity: 0;
      transform: translateY(-6px) scale(.98);
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }

    .menu-panel.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .menu-title {
      padding: 6px 8px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .theme-option {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 0;
      border-radius: 13px;
      padding: 11px 12px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      font-weight: 700;
    }

    .theme-option:hover { background: var(--soft-bg); }

    .theme-option.active {
      background: var(--accent-soft);
      color: var(--accent-label);
    }

    .theme-option .check {
      opacity: 0;
      font-weight: 900;
    }

    .theme-option.active .check { opacity: 1; }

    .search-shell {
      margin-top: 0;
    }

    .search-toggle {
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 50%;
      padding: 0;
      display: grid;
      place-items: center;
      background: var(--soft-bg);
      color: var(--text);
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }

    .search-toggle:hover {
      background: var(--accent-soft);
      border-color: rgba(109,93,252,.28);
    }

    .search-toggle:active {
      transform: scale(.96);
    }

    .search-toggle-icon {
      width: 18px;
      height: 18px;
      display: block;
    }

    .search-toggle-icon::before {
      content: "";
      display: block;
      width: 10px;
      height: 10px;
      border: 2px solid currentColor;
      border-radius: 50%;
      transform: translate(1px, 1px);
    }

    .search-toggle-icon::after {
      content: "";
      display: block;
      width: 7px;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
      transform: translate(11px, 0px) rotate(45deg);
      transform-origin: left center;
    }

    .search-toggle-label,
    .search-toggle-arrow {
      display: none;
    }

    .search-panel {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      margin-top: 0;
      transition: grid-template-rows .2s ease, opacity .16s ease, margin-top .2s ease;
    }

    .search-panel.open {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 10px;
    }

    .search-panel-inner {
      min-height: 0;
      overflow: hidden;
    }

    .genre-search {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 9px;
    }

    .genre-input {
      width: 100%;
      min-width: 0;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 14px;
      outline: none;
      background: var(--card-strong);
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
      transition: border-color .16s ease, box-shadow .16s ease;
    }

    .genre-input::placeholder { color: var(--muted); }

    .genre-input:focus {
      border-color: rgba(109,93,252,.55);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .genre-submit {
      height: 44px;
      border: 0;
      border-radius: 14px;
      padding: 0 17px;
      cursor: pointer;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: white;
      box-shadow: 0 10px 24px rgba(79,70,229,.22);
    }

    .genre-state {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 9px;
      padding: 8px 10px 8px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--soft-bg);
      color: var(--muted);
      font-size: 12px;
    }

    .genre-state.show { display: flex; }

    .genre-state strong { color: var(--text); }

    .genre-clear {
      border: 0;
      background: transparent;
      color: var(--accent-label);
      cursor: pointer;
      font-weight: 800;
      padding: 3px 5px;
    }

    @media (max-width: 640px) {
      .app { border: 0; }
      .topbar { padding-inline: 15px; }
      .card { padding-inline: 15px; }
      .word { font-size: 18px; }
      .summary { font-size: 14px; }
      .modal { padding: 0; align-items: flex-end; }
      .modal-panel {
        width: 100%;
        max-height: 88vh;
        border-radius: 22px 22px 0 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="topbar-row">
        <div>
          <h1>Trivia Timeline</h1>
          <p class="subtitle">Wikipediaから、知らない言葉に出会う。</p>
        </div>
        <div class="topbar-actions">
          <button id="searchToggle" class="search-toggle" type="button"
            aria-label="検索を開く" aria-expanded="false" aria-controls="searchPanel">
            <span class="search-toggle-icon" aria-hidden="true"></span>
          </button>

          <div class="menu-wrap">
            <button id="menuButton" class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false">
              <span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span>
            </button>
            <div id="menuPanel" class="menu-panel" aria-hidden="true">
              <div class="menu-title">表示テーマ</div>
              <button class="theme-option" type="button" data-theme-option="light">
                <span>☀️ ライト</span><span class="check">✓</span>
              </button>
              <button class="theme-option" type="button" data-theme-option="dark">
                <span>🌙 ダーク</span><span class="check">✓</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="search-shell">
        <div id="searchPanel" class="search-panel" aria-hidden="true">
          <div class="search-panel-inner">
            <form id="genreForm" class="genre-search" role="search">
              <input id="genreInput" class="genre-input" type="search" autocomplete="off"
                placeholder="例：書籍、駅、哲学者、ノルウェイの森" aria-label="ジャンルまたはタイトル" />
              <button id="genreSubmit" class="genre-submit" type="submit">決定</button>
            </form>
          </div>
        </div>
      </div>

      <div id="genreState" class="genre-state" aria-live="polite">
        <span>表示中：<strong id="genreLabel"></strong></span>
        <button id="genreClear" class="genre-clear" type="button">解除</button>
      </div>

      <div class="tabs" aria-label="表示切り替え">
        <button class="tab active" data-tab="timeline">タイムライン</button>
        <button class="tab" data-tab="favorites">お気に入り</button>
      </div>
    </header>

    <section id="timeline" class="timeline" aria-live="polite"></section>

    <div id="loadMoreWrap" class="load-more-wrap">
      <button id="loadMoreBtn" class="load-more">さらに20件読み込む</button>
    </div>
  </main>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-panel">
      <div class="modal-head">
        <h2 id="modalTitle" class="modal-title"></h2>
        <button id="closeModalBtn" class="close-btn" aria-label="閉じる">×</button>
      </div>
      <div class="modal-body">
        <section class="detail-block detail-overview">
          <div class="detail-label">概要</div>
          <p id="modalSummary" class="detail-summary"></p>
        </section>
        <section class="detail-block">
          <div class="detail-label">もう少し詳しく</div>
          <p id="modalText" class="detail-text"></p>
          <div id="detailLoading" class="detail-loading" hidden>Wikipedia本文を読み込み中…</div>
        </section>
        <div class="modal-actions">
          <a id="wikiLink" class="action primary" target="_blank" rel="noopener noreferrer">
            Wikipediaで開く
          </a>
          <button id="modalFavBtn" class="action secondary">☆ お気に入りに保存</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const PAGE_SIZE = 20;
    const API = "https://ja.wikipedia.org/w/api.php";

    async function fetchWithTimeout(url, timeoutMs = 7000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    function cleanText(text = "") {
      return text
        .replace(/\s+/g, " ")
        .replace(/\[\d+\]/g, "")
        .trim();
    }

    // AIは使わず、日本語Wikipediaが返す「ページ説明」を最優先で使う。
    // ページ説明が無い場合のみ、Wikipedia本文の定義文をルールベースで短く整形する。
    function makeDefinitionSummary(title = "", description = "", extract = "") {
      const hasJapanese = text => /[ぁ-んァ-ヶ一-龯々ー]/.test(text || "");
      const normalize = text => cleanText(text)
        .replace(/^ウィキメディアの一覧記事$/g, "")
        .replace(/^ウィキメディアの曖昧さ回避ページ$/g, "")
        .replace(/^ウィキメディアのカテゴリ$/g, "")
        .replace(/\s*[。.!！?？]+$/g, "")
        .trim();

      // Wikipediaの短い説明は「日本の俳優」「物理学の概念」のような
      // 要約用データなので、日本語ならそのまま自然な一文にする。
      const desc = normalize(description);
      if (desc && hasJapanese(desc)) {
        return (desc.length > 58
          ? desc.slice(0, 58).replace(/[、,・\s]+$/g, "") + "…"
          : desc) + (desc.length <= 58 ? "。" : "");
      }

      const text = cleanText(extract);
      if (!text) return "日本語の概要を取得できませんでした。";

      // 冒頭から最大3文を候補にし、「〜である」「〜を指す」など
      // 定義として成立しやすい一文を選ぶ。
      const sentences = text
        .split(/(?<=[。！？])/)
        .map(s => cleanText(s))
        .filter(Boolean)
        .slice(0, 3);

      const definitionPatterns = [
        /(?:である|であった|を指す|のこと|と呼ばれる|とされる|に属する|に位置する|を意味する|を表す|をいう)[。！？]?$/,
        /(?:人物|作品|概念|現象|制度|組織|団体|企業|会社|都市|地域|国|島|山|川|湖|駅|路線|建築物|施設|楽曲|映画|小説|漫画|アニメ|ゲーム|植物|動物|生物|物質|元素|技術|手法|用語|名称)[。！？]?$/
      ];

      let sentence = sentences.find(s => definitionPatterns.some(re => re.test(s))) || sentences[0] || text;

      // 長い読み仮名・原語・生没年などの括弧書きを短文化時だけ省く。
      sentence = sentence
        .replace(/（[^）]{18,}）/g, "")
        .replace(/\([^)]{18,}\)/g, "")
        .replace(/\s+/g, " ")
        .trim();

      // 「タイトルとは〜」「タイトルは〜」の形は主語を除き、
      // カードタイトルと重複しない説明文にする。
      const escapedTitle = title.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      sentence = sentence
        .replace(new RegExp("^" + escapedTitle + "[（(][^）)]*[）)](?:とは|は|、)?"), "")
        .replace(new RegExp("^" + escapedTitle + "(?:とは|は|、)"), "")
        .replace(/^[、,:：\s]+/, "")
        .trim();

      if (!sentence) sentence = sentences[0] || text;

      // タイムラインでは短く、ただし単なる途中切れに見えないようにする。
      if (sentence.length > 64) {
        const cut = sentence.slice(0, 64);
        const naturalBreak = Math.max(cut.lastIndexOf("、"), cut.lastIndexOf("。"));
        sentence = naturalBreak >= 30 ? cut.slice(0, naturalBreak) : cut;
        sentence = sentence.replace(/[、,。\s]+$/g, "") + "…。";
      } else if (!/[。！？]$/.test(sentence)) {
        sentence += "。";
      }

      return sentence;
    }

    function makeDetail(extract = "") {
      const text = cleanText(extract);
      if (!text) return "本文を取得できませんでした。";
      return text.length > 1800 ? text.slice(0, 1800) + "…" : text;
    }

    const GENERIC_GENRE_WORDS = new Set([
      "本", "書籍", "小説", "文学", "漫画", "マンガ", "絵本", "雑誌",
      "駅", "鉄道駅", "路線", "鉄道", "空港", "港",
      "人物", "人名", "作家", "小説家", "漫画家", "俳優", "女優", "声優",
      "歌手", "音楽家", "作曲家", "画家", "哲学者", "科学者", "数学者",
      "映画", "映画作品", "ドラマ", "アニメ", "ゲーム", "楽曲", "アルバム",
      "会社", "企業", "大学", "学校", "寺院", "神社", "城", "山", "川", "島",
      "都市", "国", "料理", "食べ物", "動物", "植物", "スポーツ"
    ]);

    function looksLikeGenre(query) {
      const q = query.trim();
      if (GENERIC_GENRE_WORDS.has(q)) return true;
      return /(者|家|駅|作品|映画|小説|書籍|漫画|大学|企業|会社|料理|動物|植物|スポーツ)$/.test(q) && q.length <= 12;
    }

    async function pageExistsExactly(query) {
      const params = new URLSearchParams({
        origin: "*",
        action: "query",
        format: "json",
        titles: query,
        redirects: "1"
      });
      let response;
      try {
        response = await fetchWithTimeout(`${API}?${params.toString()}`, 5000);
      } catch {
        return false;
      }
      if (!response.ok) return false;
      const data = await response.json();
      const pages = data?.query?.pages ? Object.values(data.query.pages) : [];
      return pages.some(page => !page.missing && page.ns === 0);
    }

    async function resolveSearchMode(query) {
      if (query.trim() === "本のタイトル") return "book_titles";
      if (looksLikeGenre(query)) return "genre";
      const exact = await pageExistsExactly(query);
      return exact ? "exact" : "genre";
    }

    function buildGenreSearchQuery(query) {
      const q = query.trim().replace(/"/g, "");

      // 「書籍」のように、単語検索では目的の作品一覧になりにくいジャンルは
      // Wikipedia記事で使われているテンプレートを利用して絞り込む。
      const specialQueries = {
        "本": '(hastemplate:"基礎情報 書籍" OR incategory:"小説" OR incategory:"文学作品")',
        "書籍": '(hastemplate:"基礎情報 書籍" OR incategory:"小説" OR incategory:"文学作品")',
        "小説": '(hastemplate:"基礎情報 書籍" OR incategory:"小説")',
        "駅": 'hastemplate:"駅情報"',
        "鉄道駅": 'hastemplate:"駅情報"'
      };

      if (specialQueries[q]) {
        return specialQueries[q];
      }

      const categoryMap = {
        "文学": ["文学作品", "文学"],
        "漫画": ["漫画作品", "漫画"],
        "マンガ": ["漫画作品", "漫画"],
        "絵本": ["絵本"],
        "雑誌": ["雑誌"],
        "鉄道": ["鉄道"],
        "人物": ["人物"],
        "人名": ["人物"],
        "作家": ["作家"],
        "小説家": ["小説家"],
        "漫画家": ["漫画家"],
        "俳優": ["俳優"],
        "女優": ["女優"],
        "声優": ["声優"],
        "歌手": ["歌手"],
        "音楽家": ["音楽家"],
        "作曲家": ["作曲家"],
        "画家": ["画家"],
        "哲学者": ["哲学者"],
        "科学者": ["科学者"],
        "数学者": ["数学者"],
        "映画": ["映画作品", "映画"],
        "映画作品": ["映画作品"],
        "アニメ": ["アニメ作品"],
        "ゲーム": ["コンピュータゲーム"]
      };

      const categories = categoryMap[q] || [q];
      const categoryQuery = categories
        .map(category => `incategory:"${category}"`)
        .join(" OR ");

      return `(${categoryQuery}) OR "${q}"`;
    }

    function getSearchQueries(query) {
      const q = query.trim().replace(/"/g, "");

      // 1つの検索式だけで候補が尽きたと判断しない。
      // ジャンル検索 → 通常検索 → タイトル検索の順に広げる。
      if (searchMode === "book_titles") {
        return [
          'hastemplate:"基礎情報 書籍"',
          'incategory:"小説"',
          'incategory:"文学作品"'
        ];
      }

      if (searchMode === "exact") {
        return [
          `intitle:"${q}"`,
          `"${q}"`,
          q
        ];
      }

      return [
        buildGenreSearchQuery(q),
        q,
        `intitle:"${q}"`
      ];
    }

    async function fetchGenreArticles(query, count = PAGE_SIZE) {
      const collected = [];

      while (searchBuffer.length && collected.length < count) {
        collected.push(searchBuffer.shift());
      }

      const queries = getSearchQueries(query);
      let requestsThisClick = 0;

      // 1回のクリックで検索APIは最大3回まで。
      // 20件揃わなくても途中結果を返し、画面を固めない。
      while (
        collected.length < count &&
        !searchExhausted &&
        requestsThisClick < 3
      ) {
        if (searchStage >= queries.length) {
          searchExhausted = true;
          break;
        }

        const effectiveQuery = queries[searchStage];
        const searchParams = new URLSearchParams({
          origin: "*",
          action: "query",
          format: "json",
          list: "search",
          srsearch: effectiveQuery,
          srnamespace: "0",
          srlimit: "30",
          sroffset: String(searchOffset),
          srprop: "",
          utf8: "1"
        });

        let searchData;
        try {
          const response = await fetchWithTimeout(
            `${API}?${searchParams.toString()}`,
            7000
          );
          if (!response.ok) throw new Error("Wikipedia検索に失敗しました。");
          searchData = await response.json();
        } catch (error) {
          console.warn("検索をスキップ:", effectiveQuery, error);
          // この検索式が不調でも次の検索式へ進む。
          searchStage++;
          searchOffset = 0;
          requestsThisClick++;
          continue;
        }

        const results = searchData?.query?.search || [];

        // この検索式で候補が無ければ、別の検索方法に切り替える。
        if (!results.length) {
          searchStage++;
          searchOffset = 0;
          requestsThisClick++;
          continue;
        }

        const ids = results.map(result => result.pageid).join("|");
        const pageParams = new URLSearchParams({
          origin: "*",
          action: "query",
          format: "json",
          pageids: ids,
          prop: "extracts|info|description",
          exintro: "1",
          explaintext: "1",
          inprop: "url"
        });

        let pageData;
        try {
          const response = await fetchWithTimeout(
            `${API}?${pageParams.toString()}`,
            7000
          );
          if (!response.ok) throw new Error("Wikipedia記事の取得に失敗しました。");
          pageData = await response.json();
        } catch (error) {
          console.warn("記事取得をスキップ:", error);
          requestsThisClick++;
          break;
        }

        const pages = pageData?.query?.pages ? Object.values(pageData.query.pages) : [];
        const order = new Map(results.map((result, index) => [result.pageid, index]));

        const mapped = pages
          .filter(page => page.title && page.extract)
          .sort((a, b) => (order.get(a.pageid) ?? 999) - (order.get(b.pageid) ?? 999))
          .map(page => ({
            pageid: page.pageid,
            title: page.title,
            extract: page.extract,
            summary: makeDefinitionSummary(page.title, page.description || "", page.extract),
            detail: makeDetail(page.extract),
            description: page.description || "",
            url: page.fullurl || `https://ja.wikipedia.org/?curid=${page.pageid}`
          }))
          .filter(item => item.summary && item.summary.length >= 4)
          .filter(item => {
            if (searchMode !== "book_titles") return true;

            const text = `${item.description} ${item.extract}`.slice(0, 900);
            const positive = /(小説|書籍|著書|文学作品|物語|作品|刊行|出版|長編|短編|児童文学|絵本|随筆|エッセイ|ノンフィクション)/;
            const negative = /(小説家|作家|著作家|出版社|出版者|文学者|評論家|編集者|図書館|書店|賞$)/;

            return positive.test(text) && !negative.test(item.description);
          });

        const knownIds = new Set([
          ...items.map(item => item.pageid),
          ...collected.map(item => item.pageid),
          ...searchBuffer.map(item => item.pageid)
        ]);

        const fresh = mapped.filter(item => !knownIds.has(item.pageid));
        const needed = count - collected.length;

        collected.push(...fresh.slice(0, needed));
        searchBuffer.push(...fresh.slice(needed));

        const nextOffset = searchData?.continue?.sroffset;

        if (Number.isFinite(nextOffset)) {
          searchOffset = nextOffset;
        } else {
          // この検索方法の末尾まで来たら、次の検索方法へ。
          searchStage++;
          searchOffset = 0;
        }

        requestsThisClick++;
      }

      if (searchStage >= queries.length && searchBuffer.length === 0) {
        searchExhausted = true;
      }

      return collected;
    }

    async function fetchRandomArticles(count = PAGE_SIZE) {
      const params = new URLSearchParams({
        origin: "*",
        action: "query",
        format: "json",
        generator: "random",
        grnnamespace: "0",
        grnlimit: String(count),
        prop: "extracts|info|description",
        exintro: "1",
        explaintext: "1",
        inprop: "url"
      });

      const response = await fetch(`${API}?${params.toString()}`);
      if (!response.ok) {
        throw new Error("Wikipedia APIへの接続に失敗しました。");
      }

      const data = await response.json();
      const pages = data?.query?.pages ? Object.values(data.query.pages) : [];

      const usablePages = pages.filter(page => page.title && page.extract);

      return usablePages.map(page => ({
        pageid: page.pageid,
        title: page.title,
        extract: page.extract,
        summary: makeDefinitionSummary(page.title, page.description || "", page.extract),
        detail: makeDetail(page.extract),
        url: page.fullurl || `https://ja.wikipedia.org/?curid=${page.pageid}`
      }));
    }

    async function fetchFullArticle(item) {
      const params = new URLSearchParams({
        origin: "*",
        action: "query",
        format: "json",
        pageids: String(item.pageid),
        prop: "extracts|info",
        explaintext: "1",
        exsectionformat: "plain",
        inprop: "url"
      });

      const response = await fetch(`${API}?${params.toString()}`);
      if (!response.ok) throw new Error("Wikipedia本文の取得に失敗しました。");

      const data = await response.json();
      const page = data?.query?.pages?.[item.pageid];
      const fullText = cleanText(page?.extract || "");
      if (!fullText) return item.detail;

      // AI要約は使わず、Wikipedia本文をそのまま読みやすい長さに制限する。
      return fullText.length > 4200 ? fullText.slice(0, 4200) + "…" : fullText;
    }

    function createCard(item) {
      const article = document.createElement("article");
      article.className = "card";
      article.tabIndex = 0;
      article.setAttribute("role", "button");
      article.setAttribute("aria-label", `${item.title}の詳細を見る`);

      const head = document.createElement("div");
      head.className = "card-head";

      const content = document.createElement("div");
      content.style.minWidth = "0";

      const title = document.createElement("h2");
      title.className = "word";
      title.textContent = item.title;

      const summary = document.createElement("p");
      summary.className = "summary";
      summary.textContent = item.summary || "概要を取得できませんでした。";

      content.append(title, summary);

      const fav = document.createElement("button");
      fav.className = "fav-btn" + (isFavorite(item) ? " active" : "");
      fav.type = "button";
      fav.title = isFavorite(item) ? "お気に入りから外す" : "お気に入りに保存";
      fav.textContent = isFavorite(item) ? "♥" : "♡";
      fav.addEventListener("click", event => {
        event.stopPropagation();
        toggleFavorite(item);
      });

      head.append(content, fav);

      const meta = document.createElement("div");
      meta.className = "meta";

      const source = document.createElement("span");
      source.className = "wiki-label";
      source.textContent = "Wikipedia";

      const more = document.createElement("span");
      more.textContent = "概要・詳しい解説を見る →";

      meta.append(source, more);
      article.append(head, meta);

      article.addEventListener("click", () => openModal(item));
      article.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openModal(item);
        }
      });

      return article;
    }

    function escapeHtml(value = "") {
      return value.replace(/[&<>'"]/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      }[char]));
    }

    function render() {
      timelineEl.innerHTML = "";

      const data = currentTab === "timeline" ? items : getFavorites();

      if (data.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-note";
        empty.textContent = currentTab === "favorites"
          ? "まだお気に入りはありません。カードの♡ボタンから保存できます。"
          : "トリビアを読み込んでいます。";
        timelineEl.appendChild(empty);
      } else {
        data.forEach(item => timelineEl.appendChild(createCard(item)));
      }

      loadMoreWrap.style.display = currentTab === "timeline" ? "block" : "none";
    }

    function showLoading() {
      timelineEl.innerHTML = `
        <div class="status">
          <div class="spinner"></div>
          Wikipediaからトリビアを取得中…
        </div>
      `;
    }

    function showError(message) {
      timelineEl.innerHTML = `
        <div class="status">
          ${message}<br><br>
          「さらに20件読み込む」から再試行できます。
        </div>
      `;
    }

    async function loadMore(initial = false) {
      if (loading) return;
      loading = true;
      loadMoreBtn.disabled = true;
      loadMoreBtn.textContent = "読み込み中…";

      if (initial && items.length === 0) showLoading();

      try {
        let batch = [];

        if (currentGenre) {
          batch = await fetchGenreArticles(currentGenre, PAGE_SIZE);
        } else {
          let attempts = 0;
          while (batch.length < PAGE_SIZE && attempts < 4) {
            const fetched = await fetchRandomArticles(PAGE_SIZE);
            const existingIds = new Set([...items, ...batch].map(x => x.pageid));
            batch.push(
              ...fetched.filter(item =>
                item.summary.length >= 18 &&
                !existingIds.has(item.pageid)
              )
            );
            attempts++;
          }
        }

        items.push(...batch.slice(0, PAGE_SIZE));
        render();

        if (currentGenre && batch.length === 0 && searchExhausted) {
          loadMoreBtn.disabled = true;
          loadMoreBtn.textContent = "これ以上の候補はありません";
        } else if (currentGenre && batch.length === 0) {
          loadMoreBtn.disabled = false;
          loadMoreBtn.textContent = "別の候補をさらに探す";
        }

        if (currentGenre && items.length === 0) {
          timelineEl.innerHTML = `<div class="empty-note">「${escapeHtml(currentGenre)}」の候補を取得できませんでした。<br>もう一度読み込むか、別の言葉を試してください。</div>`;
        }
      } catch (error) {
        console.error(error);
        if (items.length === 0) {
          showError("データの取得に失敗しました。通信環境を確認してください。");
        }
      } finally {
        loading = false;
        if (!(currentGenre && searchExhausted && searchBuffer.length === 0)) {
          loadMoreBtn.disabled = false;
          loadMoreBtn.textContent = "さらに20件読み込む";
        }
      }
    }

    async function openModal(item) {
      activeItem = item;
      modalTitle.textContent = item.title;
      modalSummary.textContent = item.summary || "概要を取得できませんでした。";
      modalText.textContent = item.detail || "本文を読み込んでいます。";
      detailLoading.hidden = false;
      wikiLink.href = item.url;
      updateModalFavoriteButton();
      modal.classList.add("show");
      modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      try {
        const detail = await fetchFullArticle(item);
        if (activeItem?.pageid === item.pageid) {
          modalText.textContent = detail;
        }
      } catch (error) {
        console.error(error);
        if (activeItem?.pageid === item.pageid) {
          modalText.textContent = item.detail || "詳しい本文を取得できませんでした。";
        }
      } finally {
        if (activeItem?.pageid === item.pageid) {
          detailLoading.hidden = true;
        }
      }
    }

    function closeModal() {
      modal.classList.remove("show");
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      activeItem = null;
    }

    function updateModalFavoriteButton() {
      if (!activeItem) return;
      const saved = isFavorite(activeItem);
      modalFavBtn.textContent = saved
        ? "♥ お気に入りから外す"
        : "☆ お気に入りに保存";
    }

    modalFavBtn.addEventListener("click", () => {
      if (activeItem) toggleFavorite(activeItem);
    });

    closeModalBtn.addEventListener("click", closeModal);

    modal.addEventListener("click", event => {
      if (event.target === modal) closeModal();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && modal.classList.contains("show")) {
        closeModal();
      }
    });

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        currentTab = tab.dataset.tab;
        tabs.forEach(t => t.classList.toggle("active", t === tab));
        render();
      });
    });

    genreForm.addEventListener("submit", async event => {
      event.preventDefault();
      const query = genreInput.value.trim();
      if (!query || loading) return;

      currentGenre = query;
      searchOffset = 0;
      searchBuffer = [];
      searchExhausted = false;
      searchStage = 0;
      searchMode = await resolveSearchMode(query);
      items = [];
      currentTab = "timeline";
      tabs.forEach(tab => tab.classList.toggle("active", tab.dataset.tab === "timeline"));
      genreLabel.textContent =
        searchMode === "book_titles"
          ? "本のタイトル"
          : searchMode === "genre"
            ? `${query}（ジャンル）`
            : query;
      genreState.classList.add("show");
      setSearchOpen(false);
      genreSubmit.disabled = true;

      await loadMore(true);
      genreSubmit.disabled = false;
    });

    genreClear.addEventListener("click", async () => {
      if (loading) return;
      currentGenre = "";
      searchOffset = 0;
      searchBuffer = [];
      searchExhausted = false;
      searchStage = 0;
      searchMode = "auto";
      items = [];
      genreInput.value = "";
      genreState.classList.remove("show");
      setSearchOpen(false);
      currentTab = "timeline";
      tabs.forEach(tab => tab.classList.toggle("active", tab.dataset.tab === "timeline"));
      await loadMore(true);
    });

    loadMoreBtn.addEventListener("click", () => loadMore(false));

    loadMore(true);
  </script>
</body>
</html>
